name: RDE lossless workbook smoke test
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/rde_workbook.py'
      - '.github/workflows/rde-roundtrip.yml'
      - 'data/eateries.json'
jobs:
  roundtrip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - name: Export 206 restaurants to Excel
        run: python scripts/rde_workbook.py export data/eateries.json /tmp/rde-eatery.xlsx
      - name: Import Excel to staging JSON
        run: python scripts/rde_workbook.py import /tmp/rde-eatery.xlsx /tmp/rde-candidate.json
      - name: Verify exact semantic round trip
        run: python scripts/rde_workbook.py verify data/eateries.json /tmp/rde-candidate.json
      - name: Verify workbook structure and identifiers
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          wb=load_workbook('/tmp/rde-eatery.xlsx',read_only=True)
          assert len(wb.sheetnames)==14, wb.sheetnames
          ids=[r[0] for r in list(wb['Restaurants'].values)[1:]]
          assert len(ids)==206 and len(set(ids))==206
          assert len(list(wb['LegacyFields'].values))-1==206
          print('PASS: 14 worksheets, 206 unique IDs and 206 lossless payloads')
          PY
      - name: Validate relational category foreign keys
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          wb=load_workbook('/tmp/rde-eatery.xlsx',read_only=True,data_only=True)
          ids={r[0] for r in list(wb['Restaurants'].values)[1:]}
          categories={r[0] for r in list(wb['Categories'].values)[1:]}
          relations=list(wb['RestaurantCategories'].values)[1:]
          assert categories, 'Category dimension not populated'
          assert relations, 'Restaurant categories missing'
          assert len(categories)==len(list(wb['Categories'].values))-1
          for rid,category,*_ in relations:
           assert rid in ids, f'Orphan restaurant {rid}'
           assert category in categories, f'Orphan category {category}'
          for sheet,column in [('Hours',1),('Menus',1),('Media',1),('Features',0),('ResearchStatus',0)]:
           for row in list(wb[sheet].values)[1:]:
            assert row[column] in ids, f'Orphan {sheet}: {row[column]}'
          print(f'PASS: {len(categories)} categories and {len(relations)} restaurant links; no orphan references')
          PY
      - name: Validate research status vocabulary and dropdowns
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          wb=load_workbook('/tmp/rde-eatery.xlsx')
          for name in ['ResearchStatus','RestaurantCategories','Features','Hours','Menus','Evidence']:
           ws=wb[name]
           assert len(ws.data_validations.dataValidation)>0, f'Missing dropdown: {name}'
          allowed={'verified_yes','verified_no','unverified','unknown','not_applicable','not_yet_researched','researched_no_result','conflicting','outdated'}
          assert 'verified_no' in allowed and 'unknown' in allowed and 'researched_no_result' in allowed
          print('PASS: explicit research status dropdowns present')
          PY
      - name: Validate evidence provenance and references
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          wb=load_workbook('/tmp/rde-eatery.xlsx',read_only=True,data_only=True)
          ids={r[0] for r in list(wb['Restaurants'].values)[1:]}
          sources={r[0]:r for r in list(wb['Sources'].values)[1:]}
          evidence=list(wb['Evidence'].values)[1:]
          assert len(sources)==len(list(wb['Sources'].values))-1
          assert evidence, 'Expected imported source leads'
          assert len({r[0] for r in evidence})==len(evidence)
          for eid,rid,sid,path,claim,status,reviewed in evidence:
           assert rid in ids and sid in sources, f'Orphan evidence: {eid}'
           assert status=='unverified', f'Legacy reference incorrectly asserted verified: {eid}'
           assert sources[sid][1].startswith(('http://','https://'))
          print(f'PASS: {len(sources)} sources and {len(evidence)} unverified evidence leads')
          PY
      - name: Verify history is preserved but cannot silently alter delivery JSON
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          from openpyxl import load_workbook
          wb=load_workbook('/tmp/rde-eatery.xlsx')
          assert 'ResearchHistory' in wb.sheetnames
          rid=wb['Restaurants']['A2'].value
          wb['ResearchHistory'].append(['HISTORY:TEST',rid,'name',None,'2026-11-08','test','propose','old','new','conflicting'])
          wb.save('/tmp/rde-history.xlsx')
          subprocess.run(['python','scripts/rde_workbook.py','import','/tmp/rde-history.xlsx','/tmp/rde-history.json'],check=True)
          assert json.loads(Path('/tmp/rde-history.json').read_text())==json.loads(Path('data/eateries.json').read_text())
          print('PASS: research history cannot silently overwrite delivery data')
          PY
      - name: Verify review decisions do not publish without approval gate
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          from openpyxl import load_workbook
          wb=load_workbook('/tmp/rde-eatery.xlsx')
          assert 'ReviewQueue' in wb.sheetnames
          assert len(wb['ReviewQueue'].data_validations.dataValidation)>0
          rid=wb['Restaurants']['A2'].value
          wb['ResearchHistory'].append(['HISTORY:REVIEW',rid,'name',None,'2026-11-08','tester','propose','old','replacement','pending'])
          wb['ReviewQueue'].append(['REVIEW:TEST','HISTORY:REVIEW',rid,'name','accepted','tester','2026-11-08','test only'])
          wb.save('/tmp/rde-reviewed.xlsx')
          subprocess.run(['python','scripts/rde_workbook.py','import','/tmp/rde-reviewed.xlsx','/tmp/rde-reviewed.json'],check=True)
          assert json.loads(Path('/tmp/rde-reviewed.json').read_text())==json.loads(Path('data/eateries.json').read_text())
          print('PASS: recorded approval alone cannot silently publish')
          PY
      - name: Verify intentional editing and reject legacy corruption
        run: |
          python - <<'PY'
          import json
          import subprocess
          from openpyxl import load_workbook
          from pathlib import Path
          workbook='/tmp/rde-eatery.xlsx'
          original=json.loads(Path('data/eateries.json').read_text())
          wb=load_workbook(workbook)
          ws=wb['Restaurants']
          header=[cell.value for cell in ws[1]]
          col=header.index('name')+1
          prior=ws.cell(2,col).value
          ws.cell(2,col).value=prior+' [RDE EDIT TEST]'
          wb.save('/tmp/rde-edited.xlsx')
          subprocess.run(['python','scripts/rde_workbook.py','import','/tmp/rde-edited.xlsx','/tmp/rde-edited.json'],check=True)
          changed=json.loads(Path('/tmp/rde-edited.json').read_text())
          assert changed[0]['name']==prior+' [RDE EDIT TEST]'
          assert changed[1:]==original[1:]
          assert {**changed[0], 'name':prior}==original[0]
          wb=load_workbook(workbook)
          wb['LegacyFields'].cell(2,2).value='{}'
          wb.save('/tmp/rde-tampered.xlsx')
          attempt=subprocess.run(['python','scripts/rde_workbook.py','import','/tmp/rde-tampered.xlsx','/tmp/rde-tampered.json'],capture_output=True,text=True)
          assert attempt.returncode!=0, 'Tampered source must be rejected'
          print('PASS: intentional edit isolated; tampering rejected')
          PY
      - name: Test approved candidate export and rejection gates
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          from openpyxl import load_workbook
          baseline=json.loads(Path('data/eateries.json').read_text())
          wb=load_workbook('/tmp/rde-eatery.xlsx')
          ev=next(iter(list(wb['Evidence'].values)[1:]))
          rid=ev[1]
          old=next(r['name'] for r in baseline if r['id']==rid)
          wb['ResearchHistory'].append(['H:APPROVAL',rid,'name',ev[0],'2026-11-08','researcher','propose',old,old+' [REVIEWED]','pending'])
          wb['ReviewQueue'].append(['R:APPROVAL','H:APPROVAL',rid,'name','accepted','reviewer','2026-11-08','source checked'])
          wb.save('/tmp/rde-approval.xlsx')
          command=['python','scripts/rde_approve.py','/tmp/rde-approval.xlsx','data/eateries.json','/tmp/rde-approved-candidate.json']
          result=subprocess.run(command,capture_output=True,text=True)
          assert result.returncode==0,result.stderr
          candidate=json.loads(Path('/tmp/rde-approved-candidate.json').read_text())
          assert len(candidate)==len(baseline)==206
          assert next(r['name'] for r in candidate if r['id']==rid)==old+' [REVIEWED]'
          for a,b in zip(baseline,candidate):
           if a['id']==rid: assert {**b,'name':old}==a
           else: assert a==b
          wb['ReviewQueue']['H2']=''
          wb.save('/tmp/rde-unapproved.xlsx')
          blocked=subprocess.run(['python','scripts/rde_approve.py','/tmp/rde-unapproved.xlsx','data/eateries.json','/tmp/rde-rejected-candidate.json'],capture_output=True,text=True)
          assert blocked.returncode!=0
          assert not Path('/tmp/rde-rejected-candidate.json').exists()
          print('PASS: approved candidate isolated; incomplete review rejected')
          PY
      - name: Validate local browser editor safety boundaries
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import vm from 'node:vm';
          const html=fs.readFileSync('tools/rde-local-editor.html','utf8');
          const script=html.match(/<script>([\s\S]*?)<\/script>/)?.[1];
          assert.ok(script,'Missing editor script');
          new vm.Script(script);
          for(const required of ['type="file"','Export candidate JSON','Discard edits','Permanent ID','beforeunload','URL.createObjectURL','Protected field changed','Expected 206 restaurant records','mba-rde-research-proposals-v1','publication_status','not_approved','source_url','Queue for review']){
            assert.ok(html.includes(required),'Missing editor safeguard: '+required);
          }
          assert.ok(!/\bfetch\s*\(/.test(script),'Local editor must not make network calls');
          assert.ok(!/localStorage|indexedDB|XMLHttpRequest/.test(script),'Local editor must not silently persist records');
          console.log('PASS: browser editor parses and contains local-only safety boundaries');
          JS
      - name: Test browser proposal ingestion into pending review
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          from openpyxl import load_workbook
          wb=load_workbook('/tmp/rde-eatery.xlsx',read_only=True,data_only=True)
          headers=[x.value for x in wb['Restaurants'][1]]
          row=[x.value for x in wb['Restaurants'][2]]
          rid=row[0];old=row[headers.index('name')]
          payload={'schema':'mba-rde-research-proposals-v1','publication_status':'not_approved','restaurant_count':206,'proposals':[{'history_id':'H-LOCAL-1','restaurant_id':rid,'field_path':'name','recorded_at':'2026-11-08T12:00:00Z','researcher':'CI','action':'propose','previous_value':old,'proposed_value':'Research candidate','disposition':'pending','source_url':'https://example.org/source','claim':'Needs verification'}]}
          Path('/tmp/rde-proposals.json').write_text(json.dumps(payload))
          cmd=['python','scripts/rde_ingest.py','/tmp/rde-eatery.xlsx','/tmp/rde-proposals.json','/tmp/rde-ingested.xlsx']
          result=subprocess.run(cmd,capture_output=True,text=True)
          assert result.returncode==0,result.stderr
          result=load_workbook('/tmp/rde-ingested.xlsx',read_only=True,data_only=True)
          for sheet in ('Sources','Evidence','ResearchHistory','ReviewQueue'):
           assert any(str(r[0]).startswith('INGEST:') for r in list(result[sheet].values)[1:]),sheet
          assert list(result['ReviewQueue'].values)[-1][4]=='pending'
          assert list(result['Restaurants'].values)[1][headers.index('name')]==old
          reject=subprocess.run(cmd,capture_output=True,text=True)
          assert reject.returncode==0,reject.stderr
          payload['proposals'][0]['previous_value']='stale'
          Path('/tmp/rde-proposals.json').write_text(json.dumps(payload))
          reject=subprocess.run(cmd,capture_output=True,text=True)
          assert reject.returncode!=0
          assert json.loads(Path('data/eateries.json').read_text())[0]['id']
          print('PASS: proposal ingestion creates pending linked records; stale edits rejected')
          PY
      - name: Validate independent local reviewer
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import vm from 'node:vm';
          const html=fs.readFileSync('tools/rde-local-reviewer.html','utf8');
          const script=html.match(/<script>([\s\S]*?)<\/script>/)?.[1];
          assert.ok(script);
          new vm.Script(script);
          for(const text of ['mba-rde-research-proposals-v1','mba-rde-review-decisions-v1','not_published','independent reviewer','needs_more_evidence','reviewed_at'])assert.ok(html.includes(text),text);
          assert.ok(!/\bfetch\s*\(|XMLHttpRequest|localStorage|indexedDB/.test(script));
          console.log('PASS: local reviewer syntax, decisions and nonpublishing boundaries');
          JS
      - name: Verify existing application
        run: node scripts/validate.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: rde-eatery-workbook
          path: /tmp/rde-eatery.xlsx
          retention-days: 14
