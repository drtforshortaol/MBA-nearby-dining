name: Generate genuine offline street data
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build_roads.py
      - .github/workflows/build-roads.yml
permissions:
  contents: write
concurrency:
  group: county-gis-road-snapshot
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import and validate actual county road geometry
        run: python scripts/build_roads.py
      - name: Store validated road snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/roads.json
          git diff --cached --quiet || (git commit -m "Refresh authentic Monterey County offline road geometry" && git push)
