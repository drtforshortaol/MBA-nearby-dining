name: Photo cleanup script smoke test
on:
  pull_request:
    paths:
      - 'scripts/generate-photo-cleanup-preview.py'
      - 'scripts/test-photo-cleanup-preview.py'
      - 'IMG_4940.jpeg'
      - 'photos/MBA-DINE-0031.webp'
      - 'photos/MBA-DINE-0042.webp'
      - '.github/workflows/photo-cleanup-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Generate all three candidate previews
        run: |
          python scripts/generate-photo-cleanup-preview.py --restaurant-id MBA-DINE-0068
          python scripts/generate-photo-cleanup-preview.py --restaurant-id MBA-DINE-0031
          python scripts/generate-photo-cleanup-preview.py --restaurant-id MBA-DINE-0042
      - name: Check outputs without overwriting originals
        run: python scripts/test-photo-cleanup-preview.py

      - name: Validate photo approval contract
        run: node scripts/check-photo-approval-contract.cjs
      - name: Upload generated before-after photographs for review
        uses: actions/upload-artifact@v4
        with:
          name: actual-photo-cleanup-preview-three-restaurants
          path: photo-review-previews/*.jpg
          retention-days: 14
