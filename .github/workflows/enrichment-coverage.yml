name: Restaurant enrichment coverage
on:
  pull_request:
    paths:
      - 'scripts/audit-enrichment-coverage.cjs'
      - 'data/eateries.json'
      - '.github/workflows/enrichment-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate coverage reports and validate record IDs
        run: |
          node --check scripts/audit-enrichment-coverage.cjs
          node scripts/audit-enrichment-coverage.cjs > /tmp/enrichment-coverage.json
          node scripts/audit-enrichment-coverage.cjs --csv > /tmp/enrichment-coverage.csv
          node -e "const r=require('/tmp/enrichment-coverage.json');if(r.totals.restaurantCount!==208||r.totals.enriched+r.totals.notEnriched!==208)process.exit(1)"
          test "$(wc -l < /tmp/enrichment-coverage.csv)" -eq 209
