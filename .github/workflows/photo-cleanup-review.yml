name: Photo cleanup review previews
on:
  workflow_dispatch:
    inputs:
      restaurant_id:
        description: Restaurant image to preview
        required: true
        type: choice
        options:
          - MBA-DINE-0068
          - MBA-DINE-0031
          - MBA-DINE-0042
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Generate reversible preview
        run: python scripts/generate-photo-cleanup-preview.py --restaurant-id "${{ inputs.restaurant_id }}"
      - name: Upload before-after review artifact
        uses: actions/upload-artifact@v4
        with:
          name: photo-review-${{ inputs.restaurant_id }}
          path: photo-review-previews/*.jpg
          retention-days: 14
