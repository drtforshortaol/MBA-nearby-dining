name: Acquire real Commons photos to staging
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python scripts/acquire-commons-photos.py
      - uses: actions/upload-artifact@v4
        with:
          name: licensed-photo-staging
          path: photo-staging/
          if-no-files-found: warn
