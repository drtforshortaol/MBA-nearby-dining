name: Restaurant contact consistency
on:
  pull_request:
    paths:
      - 'data/eateries.json'
      - 'tests/contact-consistency.mjs'
      - '.github/workflows/contact-consistency.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contact-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/contact-consistency.mjs
