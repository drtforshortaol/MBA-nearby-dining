name: Restaurant research readiness
on:
  pull_request:
    paths:
      - 'data/eateries.json'
      - 'data/metadata.json'
      - 'scripts/research-readiness.mjs'
      - 'tests/research-priority-contract.mjs'
      - '.github/workflows/research-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/research-priority-contract.mjs
      - run: node scripts/research-readiness.mjs
