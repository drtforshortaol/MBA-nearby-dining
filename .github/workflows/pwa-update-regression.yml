name: PWA update regression
on:
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'sw.js'
      - 'update.js'
      - 'data/metadata.json'
      - 'tests/update-contract.mjs'
      - '.github/workflows/pwa-update-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check update.js
          node tests/update-contract.mjs
