name: Validate photo acquisition pipeline
on:
  pull_request:
    paths:
      - 'data/photo-acquisition-batch-02.json'
      - 'scripts/validate-photo-acquisition-batch.cjs'
      - '.github/workflows/validate-photo-acquisition.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-photo-acquisition-batch.cjs
