name: Eatery hours data regression
on:
  pull_request:
    paths:
      - 'data/eateries.json'
      - 'tests/hours-data-regression.mjs'
      - '.github/workflows/hours-data-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-hours:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify restaurant records and hours confidence
        run: node tests/hours-data-regression.mjs
