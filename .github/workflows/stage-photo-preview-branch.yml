name: Stage cleaned real-photo previews on review branch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-photo-preview-branch.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stage-photo-previews
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Generate preview images from real existing photos
        run: |
          python scripts/generate-photo-cleanup-preview.py --restaurant-id MBA-DINE-0068
          python scripts/generate-photo-cleanup-preview.py --restaurant-id MBA-DINE-0031
          python scripts/generate-photo-cleanup-preview.py --restaurant-id MBA-DINE-0042
          for id in MBA-DINE-0021 MBA-DINE-0023 MBA-DINE-0025 MBA-DINE-0105 MBA-DINE-0149 MBA-DINE-0166; do
            python scripts/generate-photo-cleanup-preview.py --restaurant-id "$id"
          done
          python scripts/test-photo-cleanup-preview.py
          test "$(find photo-review-previews -name '*-cleanup-preview.jpg' | wc -l)" -eq 9
          python - <<'PY'
          from pathlib import Path
          ids = ('0021','0023','0025','0031','0042','0068','0105','0149','0166')
          for id in ids:
              p = Path(f'photo-review-previews/MBA-DINE-{id}-cleanup-preview.jpg')
              assert p.is_file() and p.stat().st_size > 1000, f'Missing derivative: {p}'
          print('All nine real-photo derivatives generated')
          PY
      - name: Stage previews only on dedicated review branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/photo-stage
          cp photo-review-previews/*-cleanup-preview.jpg /tmp/photo-stage/
          git fetch origin main
          git switch -C review/real-photo-cleanup-previews origin/main
          mkdir -p review-photo-previews
          cp /tmp/photo-stage/*.jpg review-photo-previews/
          git add review-photo-previews/
          if git diff --cached --quiet; then
            echo 'No preview changes'
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'review: stage nine minimally cleaned real-photo previews'
            git push origin HEAD:refs/heads/review/real-photo-cleanup-previews
          fi
      - name: Upload before-after artifact
        uses: actions/upload-artifact@v4
        with:
          name: real-photo-preview-review
          path: photo-review-previews/*.jpg
          retention-days: 14
