name: Eatery AI research proposals
on:
  workflow_dispatch:
    inputs:
      restaurant_id:
        description: 'Optional stable MBA-DINE identifier'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: eatery-ai-research
  cancel-in-progress: false
jobs:
  research-proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Research one restaurant (no database writes)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESTAURANT_ID: ${{ inputs.restaurant_id }}
          RESEARCH_MODEL: gpt-4.1-mini
        run: node scripts/research-ai-worker.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eatery-research-proposal-${{ github.run_id }}
          path: research-output/ai-proposal-*.json
          if-no-files-found: ignore
          retention-days: 14
